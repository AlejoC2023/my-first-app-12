<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Eventos | Colegio Bolívar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b1f3a, #1e5799);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: white;
            color: #0b1f3a;
            padding: 40px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        .counter {
            font-size: 80px;
            font-weight: bold;
            margin: 25px 0;
            color: #1e5799;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .click-button {
            background: #1e5799;
            color: white;
            width: 100%;
        }

        .click-button:hover {
            background: #164477;
            transform: scale(1.03);
        }

        .reset-button {
            background: #e8edf3;
            color: #0b1f3a;
            margin-top: 12px;
            width: 100%;
        }

        .reset-button:hover {
            background: #d4dce6;
        }

        .message {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>COLEGIO BOLÍVAR</h1>
        <p>Contador interactivo de eventos escolares</p>

        <div class="counter" id="counter" aria-live="polite">0</div>

        <button class="click-button" id="clickButton">
            ¡Registrar un click!
        </button>

        <button class="reset-button" id="resetButton">
            Reiniciar contador
        </button>

        <p class="message" id="message">
            ¡Participa y cuenta cada interacción!
        </p>

        <footer>
            Colegio Bolívar · Eventos y actividades escolares
        </footer>
    </main>

    <script>
        let clicks = 0;

        const counter = document.getElementById("counter");
        const clickButton = document.getElementById("clickButton");
        const resetButton = document.getElementById("resetButton");
        const message = document.getElementById("message");

        clickButton.addEventListener("click", function () {
            clicks++;
            counter.textContent = clicks;

            if (clicks === 1) {
                message.textContent = "¡Primer click registrado!";
            } else if (clicks % 10 === 0) {
                message.textContent = "¡Excelente! Has alcanzado " + clicks + " clicks.";
            } else {
                message.textContent = "¡Sigue participando! Cada click cuenta.";
            }
        });

        resetButton.addEventListener("click", function () {
            clicks = 0;
            counter.textContent = clicks;
            message.textContent = "El contador se ha reiniciado. ¡Empecemos de nuevo!";
        });
    </script>

</body>
</html>
