<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Eventos | Colegio Bolívar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #050b1a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 35px 30px;
            text-align: center;
            background: #0d1730;
            border: 1px solid #1e3154;
            border-radius: 24px;
            box-shadow: 0 0 35px rgba(0, 195, 255, 0.08);
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            margin-bottom: 22px;
            border: 1px solid #00e5ff;
            border-radius: 30px;
            color: #00e5ff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }

        .title-editor {
            margin-top: 25px;
            text-align: left;
        }

        .title-editor label {
            display: block;
            color: #00e5ff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .title-editor input {
            width: 100%;
            padding: 13px;
            background: #081126;
            border: 1px solid #33466b;
            border-radius: 10px;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .title-editor input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
        }

        .counter-box {
            margin: 28px 0;
            padding: 25px 10px;
            background: #081126;
            border: 1px solid #1e3154;
            border-radius: 18px;
        }

        .counter-label {
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .counter {
            font-size: 85px;
            font-weight: 800;
            line-height: 1.2;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            overflow-wrap: anywhere;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 13px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .click-button {
            background: #00e5ff;
            color: #06101f;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.2);
        }

        .click-button:hover {
            background: #70f3ff;
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.5);
            transform: translateY(-2px);
        }

        .reset-button {
            background: transparent;
            color: #a5b4fc;
            border: 1px solid #6366f1;
        }

        .reset-button:hover {
            background: rgba(99, 102, 241, 0.15);
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.2);
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 3px solid white;
            outline-offset: 4px;
        }

        .message {
            min-height: 24px;
            margin-top: 8px;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }

        footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #1e3154;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 400px) {
            .container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .counter {
                font-size: 68px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="badge">SCHOOL EVENTS</div>

        <h1 id="eventTitle">COLEGIO BOLÍVAR</h1>

        <p class="subtitle">
            Contador interactivo de eventos escolares.<br>
            ¡Cada click cuenta!
        </p>

        <div class="title-editor">
            <label for="titleInput">Personaliza el título del evento</label>
            <input
                type="text"
                id="titleInput"
                placeholder="Escribe el nombre del evento..."
                value="COLEGIO BOLÍVAR"
                maxlength="80"
            >
        </div>

        <section class="counter-box" aria-label="Contador de clicks">
            <p class="counter-label">Clicks registrados</p>
            <div class="counter" id="counter" aria-live="polite"
                 aria-atomic="true">0</div>
        </section>

        <button class="click-button" id="clickButton">
            + Registrar un click
        </button>

        <button class="reset-button" id="resetButton">
            Reiniciar Contador a Cero
        </button>

        <p class="message" id="message" aria-live="polite">
            ¡Participa y registra cada interacción!
        </p>

        <footer>
            COLEGIO BOLÍVAR · EVENTOS Y ACTIVIDADES
        </footer>

    </main>

    <script>
        // Variables principales
        let clicks = 0;

        // Elementos HTML
        const counter = document.getElementById("counter");
        const clickButton = document.getElementById("clickButton");
        const resetButton = document.getElementById("resetButton");
        const message = document.getElementById("message");
        const titleInput = document.getElementById("titleInput");
        const eventTitle = document.getElementById("eventTitle");

        // Incrementar el contador
        clickButton.addEventListener("click", function () {
            clicks++;
            counter.textContent = clicks;

            if (clicks === 1) {
                message.textContent =
                    "¡Tu primer click ha sido registrado!";
            } else if (clicks % 10 === 0) {
                message.textContent =
                    "¡Excelente! Has alcanzado " + clicks + " clicks.";
            } else {
                message.textContent =
                    "¡Sigue participando! Cada click cuenta.";
            }
        });

        // Reiniciar el contador a cero
        resetButton.addEventListener("click", function () {
            clicks = 0;
            counter.textContent = clicks;
            message.textContent =
                "Contador reiniciado a cero. ¡Empecemos de nuevo!";
        });

        // Actualizar el título en tiempo real mientras se escribe
        titleInput.addEventListener("input", function () {
            const newTitle = titleInput.value.trim();

            eventTitle.textContent =
                newTitle || "COLEGIO BOLÍVAR";

            document.title = newTitle
                ? newTitle + " | Contador de Eventos"
                : "Contador de Eventos | Colegio Bolívar";
        });
    </script>

</body>
</html>
