<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b1a">
    <title>Contador de Eventos | Colegio Bolívar</title>

    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
</head>

<body>
    <main class="container">
        <div class="badge">SCHOOL EVENTS</div>

        <h1 id="eventTitle">COLEGIO BOLÍVAR</h1>

        <p class="subtitle">
            Contador interactivo de eventos escolares.<br>
            ¡Cada click cuenta!
        </p>

        <section class="title-editor">
            <label for="titleInput">Personaliza el título del evento</label>
            <input
                type="text"
                id="titleInput"
                placeholder="Escribe el nombre del evento..."
                value="COLEGIO BOLÍVAR"
                maxlength="80"
            >
        </section>

        <section class="counter-box" aria-label="Contador de clicks">
            <p class="counter-label">Clicks registrados</p>
            <div class="counter" id="counter"
                 aria-live="polite" aria-atomic="true">0</div>
        </section>

        <button class="click-button" id="clickButton" type="button">
            + Registrar un click
        </button>

        <button class="reset-button" id="resetButton" type="button">
            Reiniciar Contador a Cero
        </button>

        <p class="message" id="message" aria-live="polite">
            ¡Participa y registra cada interacción!
        </p>

        <footer>
            COLEGIO BOLÍVAR · EVENTOS Y ACTIVIDADES
        </footer>
    </main>
</body>
</html>
